name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates (bun ${{ matrix.bun-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - bun-version: "1.3.10"
            advisory: false
          - bun-version: latest
            advisory: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build

  package-smoke:
    name: Packed artifact smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Run reusable packed-artifact smoke
        env:
          PACKAGE_SMOKE_LOG_DIR: ${{ runner.temp }}/package-smoke-logs
        run: bash ci/package-smoke.sh
      - name: Preserve immutable smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-smoke-log-${{ github.sha }}
          path: ${{ runner.temp }}/package-smoke-logs/
          if-no-files-found: error

  installer-node:
    name: Installer (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Installer smoke (Node only, no Bun)
        run: |
          set -euo pipefail
          node --check scripts/install-skill.js
          SANDBOX=$(mktemp -d)
          trap 'rm -rf "$SANDBOX"' EXIT
          HOME="$SANDBOX" node bin/autoresearch-install-skill --dry-run --target claude
          HOME="$SANDBOX" node bin/autoresearch-install-skill --help
          if HOME="$SANDBOX" node bin/autoresearch-install-skill --dryrun; then exit 1; fi
          if HOME="$SANDBOX" node bin/autoresearch-install-skill --target bogus; then exit 1; fi
          test ! -e "$SANDBOX/.claude/skills"
          test ! -e "$SANDBOX/.opencode/skills"
