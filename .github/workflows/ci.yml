name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Quality Gates
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun-version:
          - latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Package smoke
        run: |
          node --check scripts/install-skill.js
          node bin/autoresearch-install-skill --dry-run --target claude
          bun bin/autoresearch-mcp --help
          bun bin/autoresearch-mcp install-skill --dry-run --target opencode
          bun pm pack
          TMP_DIR=$(mktemp -d)
          bun init -y "$TMP_DIR"
          bun add "$PWD/autoresearch-mcp-0.3.0.tgz" --cwd "$TMP_DIR"
          "$TMP_DIR/node_modules/.bin/autoresearch-mcp" --help
          "$TMP_DIR/node_modules/.bin/autoresearch-install-skill" --dry-run --target opencode
          rm -rf "$TMP_DIR" autoresearch-mcp-0.3.0.tgz
