name: Forgejo Actions CI

on:
  pull_request: {}

permissions:
  contents: read

env:
  CI_WORKSPACE: ${{ forgejo.workspace }}

jobs:
  bun:
    runs-on: forgejo-ci
    container:
      image: docker.io/oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    steps:
      - name: Verify pre-checkout runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git nodejs npm
          rm -rf /var/lib/apt/lists/*
          npm install --global npm@10.9.4
          test -r /etc/ssl/certs/ca-certificates.crt
          git --version
          node --version
          test "$(npm --version)" = 10.9.4
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Audit
        run: bun audit
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      - name: Build
        run: bun run build

  node22:
    runs-on: forgejo-ci
    container:
      image: docker.io/library/node:22-bookworm-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436
    steps:
      - name: Verify pre-checkout runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
          rm -rf /var/lib/apt/lists/*
          test -r /etc/ssl/certs/ca-certificates.crt
          git --version
          node --version
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Node 22 installer contract
        run: |
          node --check scripts/install-skill.js
          SANDBOX=$(mktemp -d)
          HOME="$SANDBOX" node bin/autoresearch-install-skill --dry-run --target claude
          HOME="$SANDBOX" node bin/autoresearch-install-skill --help
          if HOME="$SANDBOX" node bin/autoresearch-install-skill --dryrun; then exit 1; fi
          if HOME="$SANDBOX" node bin/autoresearch-install-skill --target bogus; then exit 1; fi
          test ! -e "$SANDBOX/.claude/skills" && test ! -e "$SANDBOX/.opencode/skills"
          rm -rf "$SANDBOX"

  node24:
    runs-on: forgejo-ci
    container:
      image: docker.io/library/node:24-bookworm-slim@sha256:3638d9a6fe4030bd716be989438248074489337ba3275657f93595428be4fc03
    steps:
      - name: Verify pre-checkout runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
          rm -rf /var/lib/apt/lists/*
          test -r /etc/ssl/certs/ca-certificates.crt
          git --version
          node --version
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Node 24 installer contract
        run: |
          node --check scripts/install-skill.js
          SANDBOX=$(mktemp -d)
          HOME="$SANDBOX" node bin/autoresearch-install-skill --dry-run --target opencode
          HOME="$SANDBOX" node bin/autoresearch-install-skill --help
          if HOME="$SANDBOX" node bin/autoresearch-install-skill --dryrun; then exit 1; fi
          if HOME="$SANDBOX" node bin/autoresearch-install-skill --target bogus; then exit 1; fi
          test ! -e "$SANDBOX/.claude/skills" && test ! -e "$SANDBOX/.opencode/skills"
          rm -rf "$SANDBOX"

  package_smoke:
    needs: [bun, node22, node24]
    runs-on: forgejo-ci
    container:
      image: docker.io/library/node:22.22.1-bookworm-slim@sha256:4f77a690f2f8946ab16fe1e791a3ac0667ae1c3575c3e4d0d4589e9ed5bfaf3d
    steps:
      - name: Verify pre-checkout runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
          rm -rf /var/lib/apt/lists/*
          test -r /etc/ssl/certs/ca-certificates.crt
          git --version
          node --version
          df -h .
          df -i .
          ls -A .
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bootstrap canonical package toolchain
        run: |
          test "$(node --version)" = v22.22.1
          test "$(npm --version)" = 10.9.4
          npm install --global bun@1.3.10
          test "$(bun --version)" = 1.3.10
      - name: Package smoke
        run: |
          mkdir -p .ci-logs
          PACKAGE_SMOKE_LOG_DIR="$CI_WORKSPACE/.ci-logs" bash ci/package-smoke.sh

  ci:
    if: always()
    needs: [bun, node22, node24, package_smoke]
    runs-on: forgejo-ci
    container:
      image: docker.io/oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    steps:
      - name: Require all validation jobs
        run: |
          test "${{ needs.bun.result }}" = success
          test "${{ needs.node22.result }}" = success
          test "${{ needs.node24.result }}" = success
          test "${{ needs.package_smoke.result }}" = success
